name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          # Two floors to clear: trusted publishing needs Node >= 22.14.0 and
          # npm >= 11.5.1, and npm 12 itself needs Node >= 22.22.2. "22" tracks
          # the latest 22.x LTS, which satisfies both.
          node-version: "22"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install -g npm@latest
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bunx tsc --noEmit
      - run: bun run build
      # No NODE_AUTH_TOKEN: npm authenticates over OIDC, and publishes the
      # provenance attestation by itself.
      - run: npm publish
